  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #18231d; color: #f2f0e6; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; box-sizing: border-box; overflow: hidden; background: #050706; color: #f2f0e6; }
    #loading[hidden], [hidden] { display: none; }
    #loading-artwork { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    #loading-content { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); display: grid; gap: 9px; box-sizing: border-box; width: min(360px, calc(100vw - 32px)); padding: 14px 16px; border: 1px solid #a7cb7a70; border-radius: 12px; background: #070b08d9; box-shadow: 0 12px 36px #0009; backdrop-filter: blur(8px); }
    #loading-icon { display: block; width: 48px; height: 48px; margin: 0 auto; }
    h1 { margin: 0; color: #f2f0e6; font-size: clamp(18px, 3vw, 24px); letter-spacing: 0.13em; font-weight: 800; }
    #loading-status { margin: 0; color: #cbd6be; line-height: 1.45; font-size: 14px; }
    progress { width: 100%; height: 8px; border: 0; border-radius: 99px; overflow: hidden; accent-color: #a7cb7a; background: #ffffff25; }
    progress::-webkit-progress-bar { border-radius: 99px; background: #ffffff25; }
    progress::-webkit-progress-value { border-radius: 99px; background: #a7cb7a; }
    progress::-moz-progress-bar { border-radius: 99px; background: #a7cb7a; }
    progress:not([value]) { background: linear-gradient(90deg, #ffffff20 0%, #a7cb7a 45%, #ffffff20 90%); background-size: 220% 100%; animation: load-sweep 1.6s linear infinite; }
    #loading-notice { max-width: 100%; color: #e6d5a5; line-height: 1.5; font-size: 12px; }
    button { min-height: 44px; padding: 10px 24px; border: 1px solid #b7d295; border-radius: 8px; background: #324832; color: #f7f5ea; cursor: pointer; font: inherit; font-weight: 650; }
    button:hover { background: #405a3d; }
    button:focus-visible { outline: 3px solid #dce9c9; outline-offset: 3px; }
    @keyframes load-sweep { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
    @media (orientation: portrait) { #loading-artwork { object-fit: contain; } }
    @media (max-height: 460px) { #loading-content { gap: 6px; padding: 8px 12px; } h1 { font-size: 18px; } }

  <script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"bytecrafter","experimentalVK":false,"fileSizes":{"bytecrafter.pck":277693420,"bytecrafter.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const MIN_LOADING_MS = 3000;
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? 'O carregamento não apresentou progresso recente. Você pode aguardar ou tentar novamente.'
          : 'O jogo ainda está carregando. Você pode aguardar ou tentar novamente.';
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Falha ao iniciar o motor'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Falha ao iniciar o motor'));
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[ByteCrafter/loading] Falha ao iniciar:', error);
        loading.hidden = false;
        status.textContent = 'Não foi possível carregar o jogo. Tente novamente.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = 'Preparando o mundo…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'Iniciando ByteCrafter…' : `Carregando ${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Recursos Web ausentes: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          const remainingMs = Math.max(0, MIN_LOADING_MS - (performance.now() - startedAt));
          if (remainingMs > 0) {
            status.textContent = 'Finalizando a entrada no mundo…';
            await new Promise((resolve) => setTimeout(resolve, remainingMs));
          }
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = 'bytecrafter.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Não foi possível carregar o script do Godot')), { once: true });
      const artwork = document.getElementById('loading-artwork');
      const artworkReady = artwork && typeof artwork.decode === 'function'
        ? Promise.race([artwork.decode().catch(() => undefined), new Promise((resolve) => setTimeout(resolve, 1500))])
        : Promise.resolve();
      artworkReady.then(() => document.head.appendChild(script));
    })();
  </script>
